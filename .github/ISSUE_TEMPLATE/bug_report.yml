name: 🐛 Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Never post your bot token or your `.env` file.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which commands did you run, in which order?
      placeholder: |
        1. Run `/module enable module:welcome`
        2. Run `/welcome channel channel:#welcome`
        3. A new member joins
        4. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - Core (startup, configuration, database, /module, /language)
        - Welcome
        - Moderation
        - Utility
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` or the release you use
      placeholder: e.g. a1b2c3d
    validations:
      required: false

  - type: dropdown
    id: hosting
    attributes:
      label: How do you run the bot?
      options:
        - Node.js directly (npm run start:prod)
        - Development mode (npm run start:dev)
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output. Remove tokens, passwords and IDs you don't want to share.
      render: shell
    validations:
      required: false
