name: 💡 Feature request
description: Suggest a new feature or module
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation on your server, not just the solution.
      placeholder: Our moderators keep forgetting why someone was warned, because …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How should it work? Which commands or settings would you expect?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Where does it belong?
      options:
        - Improvement to an existing module
        - New module
        - Core / self-hosting
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other bots or workarounds you know of
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to help implement this
          required: false
