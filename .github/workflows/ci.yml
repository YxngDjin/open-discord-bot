name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22 is the minimum from the README, 24 the current LTS
        node-version: [22, 24]

    env:
      # prisma generate (postinstall) only reads the URL, it never connects
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
